<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Conheça o trabalho de Ivan Passos em UX/UI Design, Engenharia de Software e Design Systems. Explore os projetos, os serviços e a newsletter Loops."
    />
    <meta name="theme-color" content="#171717" />
    <title>Ivan Passos — Design e Engenharia de Software</title>
    <script>
      try {
        const theme = localStorage.getItem('theme')
        document.documentElement.dataset.theme =
          theme === 'dark' || theme === 'light'
            ? theme
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
      } catch {
        document.documentElement.dataset.theme = matchMedia(
          '(prefers-color-scheme: dark)',
        ).matches
          ? 'dark'
          : 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
